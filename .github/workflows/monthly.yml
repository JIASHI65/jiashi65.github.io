name: KOC 小群月报

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Monthly Report
        working-directory: .github/scripts
        run: node report_monthly.js
      - name: Deploy HTML
        run: |
          cp .github/scripts/monthly-*.html yoyo-community-report/ 2>/dev/null || true
          git config user.name "Mochi Bot"
          git config user.email "bot@mochi.dev"
          git add yoyo-community-report/
          git diff --staged --quiet || git commit -m "📊 Monthly report $(date +%Y%m%d)"
          git push || true
