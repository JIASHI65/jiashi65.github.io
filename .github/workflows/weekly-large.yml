name: 大群周报

on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Weekly Report
        working-directory: .github/scripts
        run: node report_weekly.js large
      - name: Deploy HTML
        run: |
          set -euo pipefail
          SRC=".github/scripts/large-weekly-$(date +%Y%m%d).html"
          test -f "$SRC" || { echo "::error::expected $SRC to exist"; exit 1; }
          cp "$SRC" yoyo-community-report/large-weekly.html
          cp "$SRC" yoyo-community-report/
          git config user.name "Mochi Bot"
          git config user.email "bot@mochi.dev"
          git add yoyo-community-report/
          git diff --staged --quiet || git commit -m "📊 Large weekly report $(date +%Y%m%d)"
          git pull --rebase origin main && git push
