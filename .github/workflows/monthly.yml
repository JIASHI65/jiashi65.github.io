name: KOC 小群月报

on:
  schedule:
    - cron: '0 8 1 * *'  # 每月 1 号
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd .github/scripts
          node report_monthly.js
      - run: |
          cp .github/scripts/monthly-*.html yoyo-community-report/ 2>/dev/null || true
          git config user.name "Mochi Bot"
          git config user.email "bot@mochi.dev"
          git add yoyo-community-report/
          git diff --staged --quiet || git commit -m "📊 Monthly report $(date +%Y%m%d)"
          git push || true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
