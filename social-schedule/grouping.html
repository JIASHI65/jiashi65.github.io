<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>📱 社媒排期 · 账号分组</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#fef6f9;color:#3d3036;min-height:100vh}

/* ── Header ── */
.header{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,#d6336c 0%,#e85378 60%,#f78da7 100%);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.header h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px}
.header .nav-group{display:flex;align-items:center;gap:8px}
.btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;
  font-size:12px;text-decoration:none;font-weight:600;transition:all .15s;
}
.btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.btn.primary{background:rgba(255,255,255,.9);color:#1a1a2e;border-color:transparent;font-weight:700}
.btn.primary:hover{background:#fff}
.month-label{font-size:16px;font-weight:700;color:#fff;min-width:90px;text-align:center}

/* ── Container ── */
.container{max-width:880px;margin:0 auto;padding:16px 16px 32px}

/* ── Stats Bar ── */
.stats{
  display:flex;gap:8px;align-items:center;padding:10px 16px;margin-bottom:16px;
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  font-size:12px;color:#6b7280;font-weight:600;
  border:1px solid var(--border);
}
.stats .stat-badge{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:#fff0f5;color:#d6336c;
}

/* ── Account Section Card ── */
.sec{
  margin-bottom:16px;background:var(--card);border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
  overflow:hidden;
}

.sec-hdr{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  font-size:14px;font-weight:700;background:var(--card);
  border-bottom:1px solid var(--border);
}
.sec-hdr .account-icon{font-size:20px;line-height:1}
.sec-hdr .count{
  margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;
  border-radius:20px;background:#f3f4f6;color:#6b7280;
}

/* ── Post Row ── */
.post{
  display:flex;padding:12px 20px;border-bottom:1px solid #f3f4f6;
  align-items:flex-start;gap:14px;font-size:13px;transition:background .12s;
}
.post:last-child{border-bottom:none}
.post:hover{background:#fafbfc}
.post-date{
  font-size:11px;color:#9ca3af;white-space:nowrap;
  min-width:48px;line-height:1.6;font-weight:500;
  padding-top:1px;
}
.post-body{flex:1;min-width:0}
.post-title{font-weight:600;font-size:13px;color:#3d3036;line-height:1.5}
.post-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.cn-badge{
  background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;
  padding:2px 10px;border-radius:6px;font-size:11px;font-weight:700;
  display:inline-block;margin-bottom:4px;letter-spacing:.2px;
}
.tag{
  font-size:10px;padding:3px 8px;border-radius:5px;
  background:#f3f4f6;color:#6b7280;font-weight:600;
}
.tag.done{background:#e8f5e9;color:#2e7d32}
.tag.progress{background:#fff0f5;color:#d6336c}

/* ── Empty State ── */
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px}

/* ── Responsive ── */
@media(max-width:600px){
  .header{padding:12px 16px;flex-wrap:wrap}
  .header h1{font-size:15px}
  .container{padding:12px}
  .post{padding:10px 14px}
}
</style>
</head>
<body>
<div class="header">
  <h1>📱 社媒排期 · 账号分组</h1>
  <div class="nav-group">
    <button class="btn" onclick="go(-1)">◀ 上月</button>
    <span id="ml" class="month-label"></span>
    <button class="btn" onclick="go(1)">下月 ▶</button>
    <a href="timeline.html" class="btn primary">← 时间线</a>
  </div>
</div>
<div class="container" id="app"><div class="empty">⏳ 加载中...</div></div>

<script>
const RAW='https://raw.githubusercontent.com/JIASHI65/jiashi65.github.io/main/social-schedule/data.json';
const LS='smm_v3_fallback';
const G=[
  {k:'uw',l:'🌊 欧美水下号',c:'#8b5cf6',b:'rgba(139,92,246,.06)'},
  {k:'tt',l:'🎵 欧美TT官号',c:'#10b981',b:'rgba(16,185,128,.06)'},
  {k:'usigoff',l:'📸 欧美IG官号',c:'#e1306c',b:'rgba(225,48,108,.06)'},
  {k:'usfb',l:'👍 欧美FB官号',c:'#1877f2',b:'rgba(24,119,242,.06)'},
  {k:'usig',l:'🎨 欧美条漫IG',c:'#c13584',b:'rgba(193,53,132,.06)'},
  {k:'ustt',l:'🎵 欧美条漫TT',c:'#25f4ee',b:'rgba(37,244,238,.06)'},
  {k:'hkig',l:'🌏 港台条漫IG',c:'#4361ee',b:'rgba(67,97,238,.06)'},
  {k:'usp',l:'📌 Pinterest官号',c:'#e60019',b:'rgba(230,0,25,.06)'},
];
const P=['待制作','制作中','已排期','已发布'];
let M=(new Date).getMonth()+1, Y=(new Date).getFullYear();

function go(d){M+=d;if(M>12){M=1;Y++}if(M<1){M=12;Y--}ld();}
function E(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

async function ld(){
  document.getElementById('ml').textContent=Y+'年'+M+'月';
  let gh={}, ls={};
  try{
    const r=await fetch(RAW+'?v='+Date.now());
    if(r.ok){const raw=await r.json();if(raw&&raw.slots)gh=raw.slots;}
  }catch(e){}
  try{const v=localStorage.getItem(LS);if(v){const j=JSON.parse(v);if(j&&j.slots)ls=j.slots;}}catch(e){}
  render({...gh, ...ls});
}

function render(data){
  const a=document.getElementById('app');
  if(!data||!Object.keys(data).length){a.innerHTML='<div class="empty">暂无数据</div>';return;}

  const mp=Y+'-'+String(M).padStart(2,'0');
  const gr={}; G.forEach(g=>{gr[g.k]=[]});

  Object.keys(data).forEach(k=>{
    const m=k.match(/^(\d+)_(\w+)_(\d+)$/);
    if(!m)return;
    const pfx=m[2], v=data[k];
    if(!gr[pfx]||!v.t||!v.t.trim())return;
    if(!v.pd||!v.pd.startsWith(mp))return;
    gr[pfx].push({...v, k:k, day:parseInt(m[1])});
  });

  let h='<div class="stats"><span>📊 '+Object.keys(data).length+' 条</span></div>';
  G.forEach(g=>{
    const it=gr[g.k]; it.sort((a,b)=>a.day-b.day);
    h+='<div class="sec"><div class="sec-hdr" style="background:'+g.b+';color:'+g.c+'">'+g.l+' · '+it.length+'条</div><div class="sec-body">';
    if(!it.length){h+='<div class="empty">暂无排期</div>';}
    else it.forEach(x=>{
      const d=(x.pd||'').slice(5), pi=P.indexOf(x.p), tc=pi>=2?'s':(pi>=0?'w':'');
      h+='<div class="post"><div class="post-date">'+d+'</div><div class="post-body">';
      if(x.cn)h+='<div class="cn-badge">📌 '+E(x.cn)+'</div>';
      h+='<div class="post-title">'+E(x.t)+'</div><div class="post-meta">';
      if(x.p)h+='<span class="tag '+tc+'">'+x.p+'</span>';
      if(x.s)h+='<span class="tag">'+E(x.s)+'</span>';
      h+='</div></div></div>';
    });
    h+='</div></div>';
  });
  a.innerHTML=h;
}
ld();
</script>
</body>
</html>
