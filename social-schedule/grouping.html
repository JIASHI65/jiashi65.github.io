<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📱 社媒排期 · 账号分组</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#fef6f9;color:#3d3036;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:#fff0f5;border-bottom:1px solid #f0dce4;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.header h1{font-size:14px;font-weight:700;color:#d6336c}
.btn{background:#fff;border:1px solid #f0dce4;color:#3d3036;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:10px;text-decoration:none}
.btn:hover{background:#ffe8ef}
.container{max-width:800px;margin:0 auto;padding:10px 12px}
.sec{margin-bottom:14px;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.04)}
.sec-body{background:#fff;overflow:hidden}
.post{display:flex;padding:9px 14px;border-bottom:1px solid #f5eaef;align-items:flex-start;gap:10px;font-size:12px}
.post:last-child{border-bottom:none}
.post:hover{background:#fff5f8}
.pd{font-size:11px;color:#c0a0b0;white-space:nowrap;min-width:44px;line-height:1.5}
.pc{flex:1;min-width:0}
.pn{font-weight:600;font-size:12px;color:#3d3036}
.pdsc{font-size:11px;color:#9a7a88;margin-top:2px}
.tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 7px;border-radius:4px;background:#fff0f5;color:#d6336c}
.tag.s{background:#e8f5e9;color:#2e7d32}
.empty{text-align:center;padding:30px;color:#c0a0b0;font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#fff5f8;border-bottom:1px solid #f0dce4;font-size:10px;color:#9a7a88}
.cn-badge{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:3px}
</style>
</head>
<body>
<div class="header">
  <h1>📱 社媒排期 · 账号分组</h1>
  <div style="display:flex;align-items:center;gap:6px">
    <button class="btn" onclick="go(-1)">◀</button>
    <span id="ml" style="font-size:13px;font-weight:600;color:#d6336c;min-width:80px;text-align:center"></span>
    <button class="btn" onclick="go(1)">▶</button>
    <a href="timeline.html" class="btn">⬅ 时间线</a>
  </div>
</div>
<div class="container" id="app"><div class="empty">⏳ 加载中...</div></div>

<script>
const GH='JIASHI65', REPO='jiashi65.github.io', BR='main';
const API='https://api.github.com/repos/'+GH+'/'+REPO+'/contents/social-schedule/data.json?ref='+BR;
const LS='smm_v3_fallback';
const G=[
  {k:'uw',l:'🌊 欧美水下号',c:'#8b5cf6',b:'rgba(139,92,246,.06)'},
  {k:'tt',l:'🎵 欧美TT官号',c:'#10b981',b:'rgba(16,185,128,.06)'},
  {k:'usigoff',l:'📸 欧美IG官号',c:'#e1306c',b:'rgba(225,48,108,.06)'},
  {k:'usfb',l:'👍 欧美FB官号',c:'#1877f2',b:'rgba(24,119,242,.06)'},
  {k:'usig',l:'🎨 欧美条漫IG',c:'#c13584',b:'rgba(193,53,132,.06)'},
  {k:'ustt',l:'🎵 欧美条漫TT',c:'#25f4ee',b:'rgba(37,244,238,.06)'},
  {k:'hkig',l:'🌏 港台条漫IG',c:'#4361ee',b:'rgba(67,97,238,.06)'},
  {k:'pt',l:'📌 Pinterest官号',c:'#e60019',b:'rgba(230,0,25,.06)'},
];
const P=['待制作','制作中','已排期','已发布'];
let M=(new Date).getMonth()+1, Y=(new Date).getFullYear();

function go(d){M+=d;if(M>12){M=1;Y++}if(M<1){M=12;Y--}ld();}
function E(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

async function ld(){
  document.getElementById('ml').textContent=Y+'年'+M+'月';
  let gh={}, ls={};
  try{
    const r=await fetch(API);
    if(r.ok){const d=await r.json();if(d.content){const bin=atob(d.content.replace(/\s/g,''));const utf8=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));const raw=JSON.parse(utf8);if(raw&&raw.slots)gh=raw.slots;}}
  }catch(e){}
  try{const v=localStorage.getItem(LS);if(v){const j=JSON.parse(v);if(j&&j.slots)ls=j.slots;}}catch(e){}
  render({...gh, ...ls});
}

function render(data){
  const a=document.getElementById('app');
  if(!data||!Object.keys(data).length){a.innerHTML='<div class="empty">暂无数据</div>';return;}

  const mp=Y+'-'+String(M).padStart(2,'0');
  const gr={}; G.forEach(g=>{gr[g.k]=[]});

  Object.keys(data).forEach(k=>{
    const m=k.match(/^(\d+)_(\w+)_(\d+)$/);
    if(!m)return;
    const pfx=m[2], v=data[k];
    if(!gr[pfx]||!v.t||!v.t.trim())return;
    if(!v.pd||!v.pd.startsWith(mp))return;
    gr[pfx].push({...v, k:k, day:parseInt(m[1])});
  });

  let h='<div class="stats"><span>📊 '+Object.keys(data).length+' 条</span></div>';
  G.forEach(g=>{
    const it=gr[g.k]; it.sort((a,b)=>a.day-b.day);
    h+='<div class="sec"><div class="sec-hdr" style="background:'+g.b+';color:'+g.c+'">'+g.l+' · '+it.length+'条</div><div class="sec-body">';
    if(!it.length){h+='<div class="empty">暂无排期</div>';}
    else it.forEach(x=>{
      const d=(x.pd||'').slice(5), pi=P.indexOf(x.p), tc=pi>=2?'s':(pi>=0?'w':'');
      h+='<div class="post"><div class="pd">'+d+'</div><div class="pc">';
      if(x.cn)h+='<div class="cn-badge">📌 '+E(x.cn)+'</div>';
      h+='<div class="pn">'+E(x.t)+'</div><div class="tags">';
      if(x.p)h+='<span class="tag '+tc+'">'+x.p+'</span>';
      if(x.s)h+='<span class="tag">'+E(x.s)+'</span>';
      h+='</div></div></div>';
    });
    h+='</div></div>';
  });
  a.innerHTML=h;
}
ld();
</script>
</body>
</html>
